<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#790b16">
    <title>End of Semester Countdown</title>
    <style>
      :root {
      --red:#790b16;
      --red2:#aa1827;
      --gold:#d8aa38;
      --cream:#fff8df;
      --ink:#4d1819
      }
      * {
      box-sizing:border-box
      }
      body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      overflow-x:hidden;
      font-family:Georgia,"Times New Roman",serif;
      color:var(--ink);
      background:radial-gradient(circle at 15% 12%,rgba(255,206,84,.55),transparent 25%),radial-gradient(circle at 88% 86%,rgba(232,174,48,.48),transparent 23%),linear-gradient(135deg,#4d0009 0%,#a51425 47%,#620912 73%,#d09d31 135%)
      }
      .floating {
      position:fixed;
      z-index:1;
      display:grid;
      place-items:center;
      width:92px;
      height:92px;
      border:2px solid rgba(255,229,146,.72);
      border-radius:24px;
      background:linear-gradient(145deg,rgba(255,239,178,.30),rgba(117,0,15,.35));
      color:#fff1ad;
      font:56px/1 Arial,sans-serif;
      opacity:.94;
      filter:drop-shadow(0 9px 11px rgba(38,0,0,.76)) drop-shadow(0 0 15px rgba(255,204,69,.62));
      text-shadow:0 3px 4px rgba(55,0,0,.65);
      pointer-events:none;
      animation:float 5s ease-in-out infinite alternate
      }
      .f1 {
      top:7%;
      left:4%;
      transform:rotate(-12deg)
      }
      .f2 {
      top:8%;
      right:5%;
      transform:rotate(10deg);
      animation-delay:-1.2s
      }
      .f3 {
      bottom:7%;
      left:5%;
      transform:rotate(8deg);
      animation-delay:-2.4s
      }
      .f4 {
      right:6%;
      bottom:6%;
      transform:rotate(-10deg);
      animation-delay:-3.6s
      }
      @keyframes float {
      from {
      translate:0 -8px
      }
      to {
      translate:0 11px
      }
      }
      .certificate {
      position:relative;
      z-index:2;
      width:min(1040px,95vw);
      min-height:570px;
      padding:60px 70px 48px;
      text-align:center;
      background:linear-gradient(120deg,rgba(255,255,255,.52),transparent 31%),var(--cream);
      border:6px double var(--gold);
      outline:2px solid #f3d479;
      outline-offset:-17px;
      box-shadow:0 30px 85px rgba(43,0,5,.65),inset 0 0 45px rgba(165,108,14,.12);
      clip-path:polygon(2% 0,98% 0,100% 3%,100% 97%,98% 100%,2% 100%,0 97%,0 3%)
      }
      .certificate:before,.certificate:after {
      content:"◆";
      position:absolute;
      top:22px;
      color:var(--gold);
      font-size:25px
      }
      .certificate:before {
      left:28px
      }
      .certificate:after {
      right:28px
      }
      .ribbon {
      display:inline-block;
      padding:7px 25px;
      border-block:1px solid var(--gold);
      color:#936912;
      font:700 13px Arial,sans-serif;
      letter-spacing:.25em;
      text-transform:uppercase
      }
      h1 {
      margin:18px 0 8px;
      color:var(--red);
      font-size:clamp(2.2rem,5vw,4.3rem);
      font-weight:600;
      letter-spacing:-.03em
      }
      .rule {
      width:180px;
      height:2px;
      margin:0 auto 26px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent)
      }
      .sub {
      max-width:700px;
      margin:0 auto 30px;
      color:#72504a;
      font-size:clamp(1rem,2vw,1.25rem);
      font-style:italic
      }
      .countdown {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
      max-width:820px;
      margin:auto
      }
      .unit {
      padding:18px 8px 15px;
      background:#fffaf0;
      border:1px solid #d8bd79;
      box-shadow:0 5px 12px rgba(92,40,18,.12)
      }
      .num {
      display:block;
      color:var(--red2);
      font:bold clamp(2.2rem,6vw,4.4rem)/1 Arial,sans-serif;
      font-variant-numeric:tabular-nums
      }
      .label {
      display:block;
      margin-top:9px;
      color:#96701d;
      font:bold 12px Arial,sans-serif;
      letter-spacing:.18em;
      text-transform:uppercase
      }
      .progress {
      height:6px;
      max-width:540px;
      margin:24px auto 0;
      overflow:hidden;
      background:#eadcb5
      }
      .bar {
      height:100%;
      width:0;
      background:linear-gradient(90deg,var(--red),var(--gold));
      transition:width .8s
      }
      .message {
      margin-top:28px;
      color:#633a34;
      font-size:1.08rem
      }
      .date {
      margin-top:8px;
      color:#a07721;
      font:700 13px Arial,sans-serif;
      letter-spacing:.12em;
      text-transform:uppercase
      }
      .done {
      display:none;
      margin-top:18px;
      color:var(--red);
      font-size:1.4rem;
      font-weight:bold
      }
      .corner {
      position:absolute;
      bottom:18px;
      color:#b98d2d;
      font-size:42px
      }
      .c1 {
      left:24px
      }
      .c2 {
      right:24px
      }
      @media(max-width:760px) {
      body {
      padding:14px
      }
      .certificate {
      padding:48px 22px 38px;
      min-height:650px
      }
      .countdown {
      grid-template-columns:repeat(2,1fr)
      }
      .floating {
      width:64px;
      height:64px;
      border-radius:17px;
      font-size:38px;
      opacity:.82
      }
      .f1,.f3 {
      left:1%
      }
      .f2,.f4 {
      right:1%
      }
      }
      @media(prefers-reduced-motion:reduce) {
      .floating {
      animation:none
      }
      }
    </style>
  </head>
  <body>
    <div class="floating f1">📚</div>
    <div class="floating f2">📝</div>
    <div class="floating f3">💻</div>
    <div class="floating f4">☕</div>
    <main class="certificate">
      <div class="ribbon">The final stretch</div>
      <h1>End of Semester</h1>
      <div class="rule">
      </div>
      <p class="sub">Counting down until lectures, deadlines and this semester are finally finished.</p>
      <section class="countdown" aria-label="Countdown to the end of bee's semester">
        <div class="unit">
          <span class="num" id="days">00</span>
          <span class="label">Days</span>
        </div>
        <div class="unit">
          <span class="num" id="hours">00</span>
          <span class="label">Hours</span>
        </div>
        <div class="unit">
          <span class="num" id="minutes">00</span>
          <span class="label">Minutes</span>
        </div>
        <div class="unit">
          <span class="num" id="seconds">00</span>
          <span class="label">Seconds</span>
        </div>
      </section>
      <div class="progress">
        <div class="bar" id="bar">
        </div>
      </div>
      <div class="message">Until the bee's semester is finished 📚</div>
      <div class="date">5 December 2026</div>
      <div class="done" id="done">Semester finished bee! Close the laptop! 🎉</div>
      <div class="corner c1">❧</div>
      <div class="corner c2">❧</div>
    </main>
    <script>
      const target=new Date(2026,11,5,0,0,0),start=new Date(2026,10,18,0,0,0),pad=n=>String(n).padStart(2,'0');function tick(){const now=new Date(),d=target-now;if(d<=0){['days','hours','minutes','seconds'].forEach(id=>document.getElementById(id).textContent='00');bar.style.width='100%';done.style.display='block';return}days.textContent=pad(Math.floor(d/86400000));hours.textContent=pad(Math.floor(d%86400000/3600000));minutes.textContent=pad(Math.floor(d%3600000/60000));seconds.textContent=pad(Math.floor(d%60000/1000));bar.style.width=Math.max(0,Math.min(100,(now-start)/(target-start)*100))+'%'}tick();setInterval(tick,1000);
    </script>
  </body>
</html>
